      warehouse_id: 0b167df1c2a3917a
  prod:
    mode: production
    workspace:
      host: https://adb-7405608528456090.10.azuredatabricks.net
      root_path: /Workspace/Users/joanscruzgarcia@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      storageName: adlsjscgproduction
      credentialName: cred_adls_prod
      externalLocationName: ext_loc_production
      catalog: production
      warehouse_id: ee1335f8d38fdb83
    permissions:
      - user_name: joanscruzgarcia@gmail.com
